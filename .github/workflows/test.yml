# This workflow tests Abelfunctions against various versions of SageMath

name: Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    # Allow to run manually

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: 3.14
      - name: Install uv
        run: python3 -m pip install uv==0.11.23 --no-deps
      - name: Install locked lint dependencies
        run: uv sync --locked --only-group lint --no-install-project
      - name: Check code with ruff
        run: |
          uv run --no-sync ruff check --output-format=github
          uv run --no-sync ruff format --check

  test:
    runs-on: ubuntu-24.04
    container:
      image: sagemath/sagemath:${{ matrix.sage-version }}
      options: --user root
    needs: static-analysis
    strategy:
      fail-fast: false
      matrix:
        sage-version:
          - '10.6'
          - '10.7'
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Install uv
        run: sage -pip install uv==0.11.23 --no-deps
      - name: Resolve Sage Python
        run: |
          echo "SAGE_PYTHON=$(sage -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$(sage -c 'import sys; print(sys.prefix)')" >> "$GITHUB_ENV"
      - name: Install locked Python dependencies
        run: |
          sage -python -m uv export --locked --group build --group test --no-emit-project --output-file /tmp/requirements-test.txt
          sage -python -m uv pip install --python "$SAGE_PYTHON" --system -r /tmp/requirements-test.txt
      - run: sage -python -m uv pip freeze --python "$SAGE_PYTHON"
      - name: Sage version
        run: sage --version
      - name: Python version
        run: sage -c 'import sys; print(sys.version)'
      - name: NumPy version
        run: sage -c 'import numpy; print(numpy.__version__)'
      - name: Cython version
        run: sage -c 'import cython; print(cython.__version__)'
      - name: Install Abelfunctions with uv
        run: sage -python -m uv pip install --python "$SAGE_PYTHON" --editable . --no-build-isolation --no-deps
      - name: Run tests
        run: sage runtests.py

  test-wheel:
    runs-on: ubuntu-24.04
    container:
      image: sagemath/sagemath:10.7
      options: --user root
    needs: static-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Install uv
        run: sage -pip install uv==0.11.23 --no-deps
      - name: Resolve Sage Python
        run: |
          echo "SAGE_PYTHON=$(sage -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$(sage -c 'import sys; print(sys.prefix)')" >> "$GITHUB_ENV"
      - name: Install locked Python dependencies
        run: |
          sage -python -m uv export --locked --group build --group test --no-emit-project --output-file /tmp/requirements-test.txt
          sage -python -m uv pip install --python "$SAGE_PYTHON" --system -r /tmp/requirements-test.txt
      - name: Build abelfunctions wheel with uv
        run: sage -python -m uv build
      - name: Install wheel
        run: sage -pip install dist/*.whl
      - name: Run tests
        run: sage runtests.py

  test-pip:
    runs-on: ubuntu-24.04
    container:
      image: sagemath/sagemath:10.7
      options: --user root
    needs: static-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Install uv
        run: sage -pip install uv==0.11.23 --no-deps
      - name: Resolve Sage Python
        run: |
          echo "SAGE_PYTHON=$(sage -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$(sage -c 'import sys; print(sys.prefix)')" >> "$GITHUB_ENV"
      - name: Build abelfunctions wheel with uv
        run: sage -python -m uv build
      - name: Install locked Python dependencies
        run: |
          sage -python -m uv export --locked --group build --group test --no-emit-project --output-file /tmp/requirements-test.txt
          sage -python -m uv pip install --python "$SAGE_PYTHON" --system -r /tmp/requirements-test.txt
      - name: Install wheel
        run: sage --pip install --no-build-isolation .
      - name: Run tests
        run: sage runtests.py

  test-passagemath:
    runs-on: ubuntu-24.04
    needs: static-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: "3.14"
      - name: Install uv
        run: python3 -m pip install uv==0.11.23 --no-deps
      - name: Install project
        run: uv sync --locked --group test --extra passagemath
      # - name: Run tests
      #   run: tox
      - name: Run tests
        run: uv run --no-sync python -m pytest --ignore=examples
