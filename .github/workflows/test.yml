# This workflow tests Abelfunctions against various versions of SageMath

name: Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    # Allow to run manually

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: 3.14
      - name: Install uv
        run: python -m pip install uv==0.11.23
      - name: Install locked lint dependencies
        run: uv sync --frozen --only-group lint --no-install-project
      - name: Check code with ruff
        run: |
          uv run --no-sync ruff check --output-format=github
          uv run --no-sync ruff format --check

  test:
    runs-on: ubuntu-24.04
    needs: static-analysis
    strategy:
      fail-fast: false
      matrix:
        sage-version:
          - '9.2'
          - '9.3'
          - '9.4'
          - '9.5'
          - '9.6'
          - '9.7'
          - '9.8'
          - '10.0'
          - '10.1'
          - '10.2'
          - '10.3'
          - '10.4'
          - '10.5'
          - '10.6'
          - '10.7'
    steps:
      - name: Install sage
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: sage
          create-args: >-
            sage=${{ matrix.sage-version }}
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Install uv
        run: python -m pip install uv==0.11.23
      - name: Resolve Sage Python
        run: echo "SAGE_PYTHON=$(micromamba run -n sage sage -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install locked Python dependencies
        run: uv export --frozen --group test --no-emit-project | uv pip install --python "$SAGE_PYTHON" --require-hashes --strict -r -
      - run: uv pip freeze --python "$SAGE_PYTHON"
      - name: NumPy version
        run: micromamba run -n sage sage -c 'import numpy; print(numpy.__version__)'
      - name: Cython version
        run: micromamba run -n sage sage -c 'import cython; print(cython.__version__)'
      - name: Install Abelfunctions with uv
        run: uv pip install --python "$SAGE_PYTHON" --editable . --no-build-isolation --no-deps
      - name: Run tests
        run: micromamba run -n sage sage runtests.py

  test-setuppy-install:
    runs-on: ubuntu-24.04
    needs: static-analysis
    steps:
      - name: Install sage
        uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: sage
          create-args: >-
            sage=9.8
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Install uv
        run: python -m pip install uv==0.11.23
      - name: Resolve Sage Python
        run: echo "SAGE_PYTHON=$(micromamba run -n sage sage -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install locked Python dependencies
        run: uv export --frozen --group test --no-emit-project | uv pip install --python "$SAGE_PYTHON" --require-hashes --strict -r -
      - name: Install Abelfunctions with setup.py
        run: micromamba run -n sage sage setup.py build_ext --inplace
      - name: Run tests
        run: micromamba run -n sage sage runtests.py

  test-passagemath:
    runs-on: ubuntu-24.04
    needs: static-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv==0.11.23
      - name: Install locked dependencies and project
        run: uv sync --frozen --group build --group test --extra passagemath --no-build-isolation
      - name: Run tests
        run: uv run python -m pytest --ignore=examples
