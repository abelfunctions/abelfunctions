[tox]
envlist = passagemath

[testenv:.pkg]
passenv =
    CPATH
    LIBRARY_PATH

[testenv:passagemath]
usedevelop = True
extras = passagemath
deps =
    pytest==7.4.4
    pytest-xdist==3.5.0

setenv =
    # For access to _doctest_environment.py
    PYTHONPATH=.
    # Create logfiles in .tox/passagemath/.sage/pexpect_logs/
    HOME={envdir}
    SAGE_PEXPECT_LOG=1

commands =
    # python3 runtests.py
    pytest --ignore=examples
    # sage -tp --environment=_doctest_environment abelfunctions
